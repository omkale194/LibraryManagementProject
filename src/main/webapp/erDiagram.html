<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER-Diagram</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .content-wrapper {
            max-width: 1200px;
            width: 100%;
        }
        .custom-heading {
            color: #333;
            margin-bottom: 2rem;
            font-weight: bold;
        }
        .image-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        
        @media (max-width: 768px) {
            .image-container {
                max-width: 100%;
            }
        }
    </style>

</head>
<body>
    <div class="content-wrapper">
		<a href="/admin"><button class="btn btn-outline-success">Home</button></a>
        <h1 class="custom-heading text-center">Entity-Relationship Diagram</h1>
        <div class="image-container">
            <img src="images/er.drawio.png" alt="ER Diagram" class="img-fluid hover-shadow w-100">
        </div>
    </div>
</body>
</html>
