<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Add Staff Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="htmlfile.css">
</head>
<body>
    <div class="container">
        <h1 class="display-4 text-center">Add Staff Member</h1>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <form method="post" action="newstaff">
                    <table>
                        <tr>
                            <td><label for="name" class="form-label">Enter Name</label></td>
                            <td>
                                <input type="text" name="name" class="form-control" required autocomplete="off">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="email" class="form-label">Enter Email</label></td>
                            <td>
                                <input type="email" name="email" class="form-control" required autocomplete="off">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="phone" class="form-label">Enter Phone</label></td>
                            <td>
                                <input type="tel" name="phone" class="form-control" required autocomplete="off">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="position" class="form-label">Select Position</label></td>
                            <td>
                                <select name="position" class="form-select" required>
                                    <option value="">Choose Position</option>
                                    <option value="Head Librarian">Head Librarian</option>
                                    <option value="Assistant Librarian">Assistant Librarian</option>
                                    <option value="IT Specialist">IT Specialist</option>
                                    <option value="Cataloger">Cataloger</option>
                                    <option value="Reference Librarian">Reference Librarian</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="salary" class="form-label">Enter Salary</label></td>
                            <td>
                                <input type="number" name="salary" class="form-control" required autocomplete="off">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" class="text-center">
                                <input type="submit" name="submit" value="Add Staff" class="btn btn-primary mt-3">
                            </td>
                        </tr>
                    </table>
                </form>
            </div>

            <div class="col-md-6 d-flex justify-content-center align-items-center">
                <img src="images/4.gif" alt="Staff Image" class="img-fluid" id="staff-image">
            </div>
        </div>
        <hr>
        <div class="text-center">
            <a href="/admin" class="btn btn-outline-primary">Home</a>
        </div>
    </div>
</body>
</html>
