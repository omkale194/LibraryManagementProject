<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Add Book</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Add a Book</h2>
            <form action="newbook" method="post" >
                <div class="form-row">
                    <div class="form-column">
                        <div class="form-group">
                            <label >Book ID:</label>
                            <input type="text"  name="bookid" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label >ISBN NO:</label>
                            <input type="text" name="isbn" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>Title:</label>
                            <input type="text"  name="title" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label >Author:</label>
                            <input type="text" name="author" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label >Genre:</label>
                            <select  name="genre" required>
                               <option value="Detective Fiction">Detective Fiction</option>
					           <option value="Drama">Drama</option>
					           <option value="Non Fiction">Non Fiction</option>
					           <option value="Mystery">Mystery</option>
					           <option value="Self Help Book">Self Help Book</option>
					           <option value="Thriller">Thriller</option>
					           <option value="philosophy">philosophy</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-column">
                        <div class="form-group">
                            <label>Language:</label>
                            <input type="text"  name="language" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label >Price:</label>
                            <input type="number"  name="price" step="0.01" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>Pages:</label>
                            <input type="number"  name="pages" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label >Publisher:</label>
                            <input type="text" name="publisher" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label >Publication Year:</label>
                            <input type="number"  name="publicationyear" required autocomplete="off">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea  name="description" rows="4" required autocomplete="off"></textarea>
                </div>
                <button type="submit" class="submit-button" name="submit">Submit</button>
                <a href="/admin"><button type="button" class="btn btn-outline-success ">Home</button></a>

            </form>
        </div>
    </div>
<hr>

</body>
</html>
