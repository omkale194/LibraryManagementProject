<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Update Staff Salary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="htmlfile.css">
</head>
<body>
    <div class="container">
        <h1 class="display-4 text-center">Update Staff Salary</h1>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <form method="post" action="upstaffsal">
                    <table>
                        <tr>
                            <td><label for="price" class="form-label">Enter Staff ID</label></td>
                            <td>
                                <input type="number" name="staffid" class="form-control" required autocomplete="off">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="price" class="form-label">Enter salary</label></td>
                            <td>
                                <input type="number" name="salary" class="form-control" required autocomplete="off">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" class="text-center">
                                <input type="submit" name="submit" value="Submit" class="btn btn-primary mt-3">
                            </td>
                        </tr>
                    </table>
                </form>
            </div>

            <!-- Image Section -->
            <div class="col-md-6 d-flex justify-content-center align-items-center">
                <img src="images/7.jpg" alt="Book Image" class="img-fluid" id="book-image">
            </div>
        </div>
        <hr>
        <div class="text-center">
            <a href="/admin" class="btn btn-outline-primary">Home</a>
        </div>
    </div>
</body>
</html>
