<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Admin Login Page</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #226B68;
            --secondary-color: #F5D55F;
            --text-color: #333;
            --bg-color: #F4F1E9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .btn {
            background-color: var(--secondary-color);
            color: var(--primary-color);
            padding: 12px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #f0c940;
        }
        header {
            background-color: #fff;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 20px;
        }
        nav ul li a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
        }
        .cta-buttons .btn {
            padding: 10px 20px;
        }
        .hero {
            background-color: var(--bg-color);
            padding: 80px 0;
            min-height: calc(100vh - 80px); /* Adjust for header height */
            display: flex;
            align-items: center;
        }
        .hero-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }
        .hero-content {
            flex: 1;
            max-width: 50%;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
            color: var(--text-color);
        }
        .login-form {
            flex: 1;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .login-form h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 24px;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-form .btn {
            width: 100%;
        }
        footer {
            background-color: var(--primary-color);
            color: var(--bg-color);
            padding: 20px 0;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                align-items: flex-start;
            }
            nav ul {
                margin-top: 20px;
            }
            nav ul li {
                margin-left: 0;
                margin-right: 20px;
            }
            .cta-buttons {
                margin-top: 20px;
            }
            .hero-container {
                flex-direction: column;
            }
            .hero-content, .login-form {
                max-width: 100%;
            }
        }
    </style>
<body>
 <header>
        <div class="container">
            <div class="logo">Book
				<i class="fas fa-book"></i>
			</div>
            <nav>
                    <ul>
                    <li><a href="#">About</a></li>
                    <li><a href="#">ER-Diagram</a></li>
                    <li><a href="#">Popular</a></li>
                    <li><a href="#">Help</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container hero-container">
                <div class="hero-content">
                    <h1>Grow Your Learning With Us</h1>
                    <p>Unlock efficient and streamlined library management with our powerful system.</p>
                    <a href="#features" class="btn">Explore Features</a>
                </div>
                <div class="login-form">
                    <h2>Admin Login</h2>
                    <form method="post" action="adminlogin">
                        <input type="text" id="userid" name="userid" placeholder="User ID" required autocomplete="off">
                        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off">
                        <button type="submit" name="submit" class="btn">Login</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2024 Booklearn. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
