<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Genre Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="htmlfile.css">
</head>
<body>
    <div class="container">
        <h1 class="display-4 text-center">Search By Genre</h1>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <form method="post" action="findgenre">
                    <table>
                        <tr>
                    <td><label for="genre" class="form-label">Genre</label></td>
                    <td>
                        <select name="genre" id="genre" class="form-select">
                            <option value="Detective Fiction">Detective Fiction</option>
                            <option value="Drama">Drama</option>
                            <option value="Non Fiction">Non Fiction</option>
                            <option value="Mystery">Mystery</option>
                            <option value="Self Help Book">Self Help Book</option>
                            <option value="Thriller">Thriller</option>
                            <option value="philosophy">Philosophy</option>
                        </select>
                    </td>
                </tr>
					<tr>
                            <td colspan="2" class="text-center">
                                <input type="submit" name="submit" value="Search" class="btn btn-primary mt-3">
                            </td>
                        </tr>
                    </table>
                </form>
            </div>

            <!-- Image Section -->
            <div class="col-md-6 d-flex justify-content-center align-items-center">
                <img src="images/2.gif" alt="Book Image" class="img-fluid" id="book-image">
            </div>
        </div>
        <hr>
        <div class="text-center">
            <a href="/admin" class="btn btn-outline-primary">Home</a>
        </div>
    </div>
</body>
</html>
