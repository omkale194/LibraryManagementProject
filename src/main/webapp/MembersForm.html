<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Members Form</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<link rel="stylesheet" href="htmlfile.css">
</head>
<body>
<div class="container">
        <h1 class="display-4 text-center">Fill Members form</h1>
        <hr>
        <form method="post" action="addmem">
            <table>
                <tr>
                    <td><label for="memberid" class="form-label">MemberId</label></td>
                    <td>
                        <input type="text" name="mid" class="form-control"required autocomplete="off">
                    </td>
                </tr>
                <tr>
                    <td><label for="name" class="form-label">Name</label></td>
                    <td>
                        <input type="text" name="name" class="form-control"required autocomplete="off">
                    </td>
                </tr><tr>
                    <td><label for="age" class="form-label">Age</label></td>
                    <td>
                        <input type="number" name="age" class="form-control"required autocomplete="off">
                    </td>
                </tr>
                <tr>
                    <td><label for="email" class="form-label">email</label></td>
                    <td>
                        <input type="text" name="email" class="form-control"required autocomplete="off">
                    </td>
                </tr>
                 <tr>
                    <td><label for="mobile" class="form-label">Mobile</label></td>
                    <td>
                        <input type="text" name="mobile" class="form-control"required autocomplete="off">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="text-center">
                        <input type="submit" name="submit" value="Submit" class="btn btn-primary mt-3">
                    </td>
                </tr>
            </table>
        </form>
        <hr>
        <div class="text-center">
            <a href="/admin" class="btn btn-outline-primary">Home</a>
        </div>
    </div>
</body>
</html>
